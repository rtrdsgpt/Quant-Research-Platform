name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt only -- deliberately not requirements-optional.txt
          # (torch/transformers/tensorflow) or requirements-dev.txt (jupyter/dvc).
          # Nothing in tests/ exercises real FinBERT sentiment or autoencoder
          # selection (both have a tested synthetic/PCA fallback), and the
          # full stack -- torch especially, which pulls several GB of CUDA
          # libraries without an explicit CPU-only index -- exhausted this
          # runner's disk. See requirements.txt's own header comment.
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
