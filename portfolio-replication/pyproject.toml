[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-replication"
version = "1.0.0"
description = "S&P 500 index replication via LASSO/autoencoder stock selection and Markowitz/HRP weighting, with rolling cross-validated sparsity selection."
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "pyyaml",
    "tensorflow",
    "cvxpy",
]

[tool.setuptools.packages.find]
where = ["src"]
