# Configuration for the portfolio replication pipeline.

paths:
  data_dir: data # committed reference data (sector map)
  raw_data_dir: data/raw # daily price CSVs, not committed: ^GSPC.csv + one <TICKER>.csv per constituent
  output_dir: results

data:
  sector_map_file: sector_map.csv

dates:
  train_start: "2020-01-01"
  train_end: "2024-06-30"
  valid_start: "2024-07-01"
  valid_end: "2025-06-30"
  holdout_start: "2025-07-01"
  holdout_end: "2025-12-31"
  rolling_folds:
    - ["2020-01-01", "2023-12-31", "2024-01-01", "2024-06-30"]
    - ["2020-01-01", "2024-06-30", "2024-07-01", "2024-12-31"]
    - ["2020-01-01", "2024-12-31", "2025-01-01", "2025-06-30"]

selection:
  k_default: 50
  k_max_final: 50
  k_min_opt: 10 # optimal-k search range is k_max_final down to k_min_opt (exclusive)
  sweep_min_k: 10
  sweep_max_k: 100
  sweep_step: 5
  selection_tol: 0.30 # accept sparser k within this TE tolerance of the best CV TE

weighting:
  ridge_eps: 1.0e-6
  weight_reg: 1.0e-3
  max_stock_weight: 0.08
  sector_cap_buffer: 0.03
  min_sector_weight_for_quota: 0.04
  sector_quota_relax: 0.35

autoencoder:
  max_latent: 12
  dropout: 0.20
  epochs: 10

market:
  trading_days_per_year: 252

simulation:
  random_seed: 42
